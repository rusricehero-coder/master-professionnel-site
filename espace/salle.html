<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Salle de cours — Master Professionnel</title>
<link rel="icon" href="../assets/brand/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="assets/espace.css">
<style>
  body.app { background: #0A1730; margin: 0; }
  .salle-entete {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 12px 18px; background: #0B2653; color: #fff;
  }
  .salle-entete img { height: 32px; width: auto; }
  .salle-entete strong { font-size: .95rem; }
  .salle-entete .btn { margin-left: auto; }
  #jitsi { width: 100%; height: calc(100vh - 58px); background: #000; }
  .salle-message { max-width: 520px; margin: 60px auto; padding: 28px; background: #fff; border-radius: 16px; text-align: center; }
</style>
</head>
<body class="app">
<header class="salle-entete">
  <a href="../index.html"><img src="../assets/brand/logo-horizontal-dark.svg" alt="Master Professionnel"></a>
  <strong id="titre-salle">Salle de cours</strong>
  <a class="btn btn--sm btn--outline" href="espace.html">Quitter</a>
</header>

<div id="jitsi"></div>

<div class="salle-message" id="message" hidden>
  <h2 id="m-titre" style="margin-bottom:10px">Chargement…</h2>
  <p id="m-texte" class="app-sub" style="margin-bottom:20px">Préparation de la salle.</p>
  <a class="btn" href="espace.html">Retour à mon espace</a>
</div>

<script src="assets/config.js"></script>
<script type="module">
import { sessionValide, select, messageErreur } from "./assets/api.js?v=13";

const params = new URLSearchParams(location.search);
const sessionId = params.get("s");
const message = document.getElementById("message");
const salle = document.getElementById("jitsi");

function erreur(titre, texte) {
  salle.style.display = "none";
  message.hidden = false;
  document.getElementById("m-titre").textContent = titre;
  document.getElementById("m-texte").textContent = texte;
}

if (!sessionId) {
  erreur("Lien incomplet", "Ouvrez ce cours depuis votre espace apprenant.");
} else {
  const session = await sessionValide();
  if (!session) {
    location.href = "index.html";
  } else {
    try {
      const token = session.access_token;
      const lignes = await select(
        "sessions",
        "select=id,titre,salle,debut,duree_min,statut&id=eq." + sessionId,
        token
      );
      const cours = lignes && lignes[0];
      if (!cours) throw new Error("Session introuvable ou accès non autorisé.");
      if (cours.statut === "annulee") throw new Error("Cette session a été annulée.");

      document.getElementById("titre-salle").textContent = cours.titre;

      const profil = await select("profiles", "select=nom&id=eq." + session.user.id, token);
      const nom = (profil && profil[0] && profil[0].nom) || session.user.email;

      await new Promise((ok, ko) => {
        const s = document.createElement("script");
        s.src = "https://meet.jit.si/external_api.js";
        s.onload = ok;
        s.onerror = ko;
        document.head.appendChild(s);
      });

      const api = new window.JitsiMeetExternalAPI("meet.jit.si", {
        roomName: cours.salle,
        parentNode: salle,
        userInfo: { displayName: nom },
        configOverwrite: {
          prejoinPageEnabled: false,
          disableDeepLinking: true,
          startWithAudioMuted: false,
          startWithVideoMuted: false,
          toolbarButtons: [
            "microphone", "camera", "desktop", "chat", "raisehand",
            "participants-pane", "tileview", "fullscreen", "security", "settings", "hangup",
          ],
        },
        interfaceConfigOverwrite: { SHOW_JITSI_WATERMARK: false, DEFAULT_BACKGROUND: "#0A1730" },
      });

      api.addEventListener("readyToClose", () => {
        location.href = "espace.html";
      });
      window.addEventListener("beforeunload", () => api.dispose());
    } catch (e) {
      erreur("Impossible d'ouvrir la salle", messageErreur(e));
    }
  }
}
</script>
</body>
</html>
