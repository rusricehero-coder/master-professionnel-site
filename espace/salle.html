<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Salle de cours — Master Professionnel</title>
<link rel="icon" href="../assets/brand/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="assets/espace.css">
<style>
  body.app { background: #0A1730; }
  .salle-entete {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 12px 18px; background: #0B2653; color: #fff;
  }
  .salle-entete img { height: 32px; width: auto; }
  .salle-entete strong { font-size: .95rem; }
  .salle-entete .btn { margin-left: auto; }
  #jitsi { width: 100%; height: calc(100vh - 58px); background: #000; }
  .salle-message { max-width: 520px; margin: 60px auto; padding: 28px; background: #fff; border-radius: 16px; text-align: center; }
</style>
</head>
<body class="app" style="margin:0">
<header class="salle-entete">
  <a href="../index.html"><img src="../assets/brand/logo-horizontal-dark.svg" alt="Master Professionnel"></a>
  <strong id="titre-salle">Salle de cours</strong>
  <a class="btn btn--sm btn--outline" href="espace.html" id="quitter">Quitter</a>
</header>

<div id="jitsi"></div>

<div class="salle-message" id="message" hidden>
  <h2 id="m-titre" style="margin-bottom:10px">Chargement…</h2>
  <p id="m-texte" class="app-sub" style="margin-bottom:20px">Préparation de la salle.</p>
  <a class="btn" href="espace.html">Retour à mon espace</a>
</div>

<script src="assets/config.js"></script>
<script type="module">
import { sessionValide, fonction, messageErreur } from "./assets/api.js?v=10";

const params = new URLSearchParams(location.search);
const sessionId = params.get("s");
const jeton = params.get("t");
const message = document.getElementById("message");
const salle = document.getElementById("jitsi");

function erreur(titre, texte) {
  salle.style.display = "none";
  message.hidden = false;
  document.getElementById("m-titre").textContent = titre;
  document.getElementById("m-texte").textContent = texte;
}

if (!sessionId || !jeton) {
  erreur("Lien incomplet", "Ce lien de cours est incomplet. Ouvrez-le depuis votre espace apprenant.");
} else {
  const session = await sessionValide();
  if (!session) {
    location.href = "index.html";
  } else {
    try {
      const info = await fonction("jitsi-token", { session_id: sessionId, jeton }, session.access_token);
      document.getElementById("titre-salle").textContent = info.titre || "Salle de cours";

      await new Promise((resoudre, rejeter) => {
        const script = document.createElement("script");
        script.src = "https://" + info.domain + "/external_api.js";
        script.onload = resoudre;
        script.onerror = rejeter;
        document.head.appendChild(script);
      });

      const api = new window.JitsiMeetExternalAPI(info.domain, {
        roomName: info.roomName,
        parentNode: salle,
        jwt: info.jwt,
        configOverwrite: {
          prejoinPageEnabled: false,
          disableDeepLinking: true,
          startWithAudioMuted: !info.moderateur,
          startWithVideoMuted: false,
          toolbarButtons: [
            "microphone", "camera", "closedcaptions", "desktop", "chat",
            "raisehand", "participants-pane", "tileview", "select-background",
            "fullscreen", "hangup", "settings", "mute-everyone", "security",
          ],
        },
        interfaceConfigOverwrite: { SHOW_JITSI_WATERMARK: false },
      });

      api.addEventListener("readyToClose", () => {
        location.href = "espace.html";
      });
      window.addEventListener("beforeunload", () => api.dispose());
    } catch (e) {
      erreur("Impossible d'ouvrir la salle", messageErreur(e));
    }
  }
}
</script>
</body>
</html>
