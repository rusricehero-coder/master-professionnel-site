<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Connexion — Espace apprenant Master Professionnel</title>
<link rel="icon" href="../assets/brand/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="assets/espace.css">
</head>
<body class="app">
<header class="app-header">
  <div class="app-header__inner">
    <a href="../index.html"><img src="../assets/brand/logo-horizontal.svg" alt="Master Professionnel"></a>
    <a class="btn btn--sm btn--outline app-header__spacer" href="../index.html">← Retour au site</a>
  </div>
</header>

<main class="app-main" style="max-width:540px">
  <h1 class="app-title" style="font-size:1.9rem">Espace apprenant</h1>
  <p class="app-sub">Créez votre compte pour suivre votre dossier, vos inscriptions et vos cours.</p>

  <div class="app-card">
    <div class="tabs" role="tablist">
      <button type="button" id="tab-login" class="is-active" role="tab">Connexion</button>
      <button type="button" id="tab-signup" role="tab">Créer un compte</button>
    </div>

    <div id="alert" class="alert" hidden></div>
    <div id="statut-js" class="alert alert--info">Chargement du module…</div>

    <form id="form-login" class="form-grid" novalidate>
      <div class="field"><label for="l-email">E-mail</label><input id="l-email" type="email" autocomplete="email" required placeholder="vous@exemple.com"></div>
      <div class="field"><label for="l-pass">Mot de passe</label><input id="l-pass" type="password" autocomplete="current-password" required placeholder="••••••••"></div>
      <button class="btn" type="submit">Se connecter</button>
    </form>

    <form id="form-signup" class="form-grid" hidden novalidate>
      <div class="field"><label for="s-nom">Nom et prénoms *</label><input id="s-nom" type="text" autocomplete="name" required placeholder="Votre nom complet"></div>
      <div class="field"><label for="s-tel">Téléphone / WhatsApp *</label><input id="s-tel" type="tel" autocomplete="tel" required placeholder="+229 …"></div>
      <div class="field"><label for="s-email">E-mail *</label><input id="s-email" type="email" autocomplete="email" required placeholder="vous@exemple.com"></div>
      <div class="field"><label for="s-pass">Mot de passe * (8 caractères minimum)</label><input id="s-pass" type="password" autocomplete="new-password" minlength="8" required placeholder="••••••••"></div>
      <button class="btn" type="submit">Créer mon compte</button>
    </form>
  </div>

  <p class="app-sub" style="font-size:.8rem">En créant un compte, vous acceptez notre
    <a href="../confidentialite.html">politique de confidentialité</a>. Vos données servent uniquement au suivi de votre inscription.</p>
</main>

<script>
/* Filet de sécurité : si le module ES n'a pas démarré (cache, blocage), on le dit. */
setTimeout(function () {
  var el = document.getElementById("statut-js");
  if (el && !window.__MP_OK) {
    el.className = "alert alert--error";
    el.textContent =
      "Le script de l'espace n'a pas démarré. Recharge la page avec Ctrl+Shift+R, ou désactive le bloqueur de publicité / VPN, puis réessaie.";
  }
}, 4000);
</script>

<script src="assets/config.js"></script>
<script type="module">
import { configured, inscription, connexion, session, messageErreur, testerConnexion } from "./assets/api.js?v=10";
import { $, alerte } from "./assets/ui.js?v=10";

const zone = $("#alert");
const formLogin = $("#form-login");
const formSignup = $("#form-signup");
const tabLogin = $("#tab-login");
const tabSignup = $("#tab-signup");

function afficher(texte, type) {
  alerte(zone, texte, type || "info");
}

const statut = $("#statut-js");
window.__MP_OK = true;

function etat(texte, type) {
  if (!statut) return;
  statut.textContent = texte;
  statut.className = "alert alert--" + (type || "info");
}

if (!configured) {
  etat("Client v5 · configuration Supabase manquante dans config.js", "error");
} else {
  etat("Client v5 · test de liaison à Supabase…", "info");
  testerConnexion()
    .then((code) => {
      if (code === 200) etat("Client v5 · Supabase joignable ✓ — vous pouvez créer votre compte.", "ok");
      else etat("Client v5 · Supabase répond " + code + " : la clé publishable est probablement invalide.", "error");
    })
    .catch(() =>
      etat(
        "Client v5 · Supabase INJOIGNABLE : réseau, VPN ou bloqueur de publicité. Essayez depuis un autre réseau.",
        "error"
      )
    );
}

window.addEventListener("error", (e) => afficher("Erreur technique : " + e.message, "error"));
window.addEventListener("unhandledrejection", (e) =>
  afficher("Erreur : " + ((e.reason && e.reason.message) || e.reason), "error")
);

if (!configured) {
  afficher("Espace non configuré : la clé Supabase est absente de espace/assets/config.js.", "error");
}

if (session()) window.location.href = "espace.html";

function basculer(versInscription) {
  tabLogin.classList.toggle("is-active", !versInscription);
  tabSignup.classList.toggle("is-active", versInscription);
  formLogin.hidden = versInscription;
  formSignup.hidden = !versInscription;
  afficher("", "info");
}
tabLogin.addEventListener("click", () => basculer(false));
tabSignup.addEventListener("click", () => basculer(true));

formLogin.addEventListener("submit", async (e) => {
  e.preventDefault();
  const bouton = formLogin.querySelector("button");
  bouton.disabled = true;
  bouton.textContent = "Connexion…";
  try {
    await connexion($("#l-email").value.trim(), $("#l-pass").value);
    window.location.href = "espace.html";
  } catch (err) {
    afficher(messageErreur(err), "error");
  } finally {
    bouton.disabled = false;
    bouton.textContent = "Se connecter";
  }
});

formSignup.addEventListener("submit", async (e) => {
  e.preventDefault();
  const bouton = formSignup.querySelector("button");
  bouton.disabled = true;
  bouton.textContent = "Création…";
  try {
    const data = await inscription($("#s-email").value.trim(), $("#s-pass").value, {
      nom: $("#s-nom").value.trim(),
      telephone: $("#s-tel").value.trim(),
    });
    if (data && data.access_token) {
      window.location.href = "espace.html";
    } else {
      afficher("Compte créé. Ouvrez l'e-mail de confirmation, cliquez sur le lien, puis revenez vous connecter.", "ok");
      formSignup.reset();
    }
  } catch (err) {
    afficher(messageErreur(err), "error");
  } finally {
    bouton.disabled = false;
    bouton.textContent = "Créer mon compte";
  }
});
</script>
</body>
</html>
